version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Copy these from your .env file or override them here
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      - VITE_ADMIN_PASSCODE=${VITE_ADMIN_PASSCODE:-sakhi12}
      
      # Use PostgreSQL in production via docker-compose
      # - DATABASE_URL=postgresql://sakhiuser:sakhipassword@db:5432/sakhidb
      
      # Or fall back to SQLite for easy testing
      - DATABASE_URL=sqlite:///./sakhi.db
      
      - FRONTEND_URL=http://localhost:8000
    depends_on:
      # Uncomment if using PostgreSQL
      # - db
    restart: unless-stopped

  # Uncomment to use a robust PostgreSQL database instead of SQLite
  # db:
  #   image: postgres:15-alpine
  #   environment:
  #     - POSTGRES_USER=sakhiuser
  #     - POSTGRES_PASSWORD=sakhipassword
  #     - POSTGRES_DB=sakhidb
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  postgres_data:
